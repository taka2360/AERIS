name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Same image as scripts/vrt-linux.sh so screenshots match the baselines.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # Mock provider only — no external API is called in CI.
      - run: pnpm exec playwright test --project="e2e-*"
      # Missing Linux baselines are created (not failed) and uploaded for review/commit.
      - run: pnpm exec playwright test --project="vrt-*" --update-snapshots=missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-output
          path: |
            test-results
            tests/visual/__screenshots__/*-linux.png
          retention-days: 7
